name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Keep Node fetch on loopback even if the runner exports HTTP(S)_PROXY.
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
      no_proxy: 127.0.0.1,localhost,::1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # engines: >=22.13.0 — use current Node 22.x (22.13.x undici had CI-only 503s)
          node-version: "22"
          cache: npm

      # .openai/ is gitignored; Vite imports .openai/hosting.json at config load.
      # Non-secret local stub only (same shape previous agents used locally).
      - name: Stub .openai/hosting.json
        run: |
          mkdir -p .openai
          printf '%s\n' '{"d1":"DB","r2":null}' > .openai/hosting.json

      - name: Install dependencies
        run: npm run install:ci

      # Requires the lint fixes from PR #2; lint errors must fail this job.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Apply local D1 migrations
        run: |
          persist="$(pwd)/.sites-runtime/ci-d1"
          for file in \
            drizzle/0000_stiff_sabretooth.sql \
            drizzle/0001_fearless_reaper.sql \
            drizzle/0002_global_integration_limits.sql
          do
            node --import ./scripts/sites-env.mjs \
              ./node_modules/wrangler/bin/wrangler.js d1 execute DB \
              --local \
              --config dist/server/wrangler.json \
              --persist-to "$persist" \
              --file "$file"
          done

      # Local OTP preview needs LOCAL_PREVIEW_ENABLED (no RESEND/NCBI secrets).
      # Run wrangler on :5173 directly (same persist/bindings as preview:local) so
      # smoke hits the Worker without the Node proxy in scripts/preview-local.mjs,
      # which can turn multi Set-Cookie responses into opaque 503s on Actions.
      - name: Smoke test (local preview)
        run: |
          set -euo pipefail
          cp .dev.vars.example .dev.vars
          printf '\nLOCAL_PREVIEW_ENABLED=true\n' >> .dev.vars
          mkdir -p .sites-runtime
          persist="$(pwd)/.sites-runtime/ci-d1"

          node --import ./scripts/sites-env.mjs \
            ./node_modules/wrangler/bin/wrangler.js d1 execute DB \
            --local --config dist/server/wrangler.json --persist-to "$persist" \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'analytics_%' ORDER BY name" \
            | tee .sites-runtime/d1-tables.log
          grep -q analytics_visitors .sites-runtime/d1-tables.log

          node --import ./scripts/sites-env.mjs \
            ./node_modules/wrangler/bin/wrangler.js dev \
            --config dist/server/wrangler.json \
            --local --persist-to "$persist" \
            --ip 127.0.0.1 --port 5173 --inspector-port 0 --log-level warn \
            --var LOCAL_PREVIEW_ENABLED:true \
            --var ADMIN_RP_ID:localhost \
            --var 'ADMIN_ORIGIN:http://127.0.0.1:5173' \
            --var ADMIN_BOOTSTRAP_ENABLED:true \
            --var 'ADMIN_EMAILS:evidenciasmedicas@outlook.com' \
            > .sites-runtime/preview-ci.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:5173/api/account" >/dev/null; then
              echo "Preview ready after ${attempt} attempt(s)."
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "Preview process exited early. Log:"
              cat .sites-runtime/preview-ci.log || true
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Preview failed to become ready. Log:"
            cat .sites-runtime/preview-ci.log || true
            exit 1
          fi

          consent=$(curl -s -o /tmp/consent-probe.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:5173/api/analytics/consent" \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:5173' \
            -d '{"consent":false}')
          echo "Consent probe HTTP ${consent}: $(cat /tmp/consent-probe.json)"
          test "$consent" = "200"

          auth=$(curl -s -o /tmp/auth-probe.json -w '%{http_code}' \
            -X POST "http://127.0.0.1:5173/api/auth/request" \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:5173' \
            -d '{"mode":"register","role":"student","name":"Probe CI","college":"Faculdade CI","state":"MG","email":"probe-ci@example.test","phone":"","emailNotifications":false,"whatsappNotifications":false,"privacyConsent":true}')
          echo "Auth probe HTTP ${auth}: $(cat /tmp/auth-probe.json)"
          test "$auth" = "200"

          echo "Node $(node -v)"

          # Workerd local preview can return 503 when undici reuses a connection.
          # Close each smoke connection; do not retry or accept failed assertions.
          cat > .sites-runtime/smoke-fetch.mjs <<'EOF'
          const originalFetch = globalThis.fetch;
          globalThis.fetch = (input, init = {}) => {
            const headers = new Headers(init.headers ?? (input instanceof Request ? input.headers : undefined));
            headers.set("Connection", "close");
            return originalFetch(input, { ...init, headers });
          };
          EOF

          # Use the same connection policy for the probe and the smoke.

          node --import ./.sites-runtime/smoke-fetch.mjs --input-type=module <<'EOF'
          const origin = "http://127.0.0.1:5173";
          async function call(path, method = "GET", data) {
            const r = await fetch(origin + path, {
              method,
              headers: { "Content-Type": "application/json", Origin: origin },
              ...(data ? { body: JSON.stringify(data) } : {}),
            });
            const text = await r.text();
            console.log(method, path, r.status, text.slice(0, 300));
            return r.status;
          }
          const statuses = [
            await call("/api/bookmarks"),
            await call("/api/admin/dashboard"),
            await call("/api/admin/catalog", "POST", {}),
            await call("/api/analytics/consent", "POST", { consent: false }),
          ];
          if (statuses[3] !== 200) process.exit(1);
          EOF

          node --import ./.sites-runtime/smoke-fetch.mjs scripts/smoke-test.mjs
